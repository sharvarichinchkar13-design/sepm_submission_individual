name: Deploy to Sepolia

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Compile contracts
        run: npx hardhat compile

      - name: Deploy to Sepolia
        id: deploy
        run: |
          OUTPUT=$(npx hardhat run scripts/deploy.js --network sepolia)
          echo "$OUTPUT"
          ADDRESS=$(echo "$OUTPUT" | grep -oE '0x[a-fA-F0-9]{40}' | head -1)
          if [ -z "$ADDRESS" ]; then
            echo "Contract address not found"
            exit 1
          fi
          echo "contract_address=$ADDRESS" >> "$GITHUB_OUTPUT"
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          SEPOLIA_PRIVATE_KEY: ${{ secrets.SEPOLIA_PRIVATE_KEY }}

      - name: Add Etherscan link to workflow summary
        run: |
          echo "## Deployment successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Contract address: \`${{ steps.deploy.outputs.contract_address }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[View on Sepolia Etherscan](https://sepolia.etherscan.io/address/${{ steps.deploy.outputs.contract_address }})" >> "$GITHUB_STEP_SUMMARY"